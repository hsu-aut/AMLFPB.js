<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FPB.js in the AutomationML Editor</title>
  <!-- FPB.js styles; those of diagram-js come with the bundle, and since 2.0
       FPB.js needs neither React nor Bootstrap -->
  <link rel="stylesheet" href="./css/fpbjs.css">
  <link rel="stylesheet" href="./css/dark-mode.css">
  <style>
    /* the layout of the web app (FPB.JS/app/index.html), without the rules
       for touch screens and sheets */
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    .fpb-wrapper {
      height: 100%;
      width: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }
    .modeler-parent {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: minmax(0, 1fr);
      position: relative;
      min-height: 0;
    }
    #modeler-container {
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    .side-panels {
      display: flex;
      min-height: 0;
    }
    /* the editor gives the plugin a narrow area (about 535 CSS pixels at
       200 % scaling): the open panel leaves the diagram at least half */
    #properties-container {
      max-width: 50vw;
      min-width: 0;
      box-sizing: border-box;
    }
    #properties-container,
    #layer-container {
      border-left: solid 1px #CCC;
      background: #FAFAFA;
      padding: 5px;
      overflow: auto;
    }
    #boot-error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #b00;
      font-family: Consolas, monospace;
      white-space: pre-wrap;
      padding: 16px;
      box-sizing: border-box;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="fpb-wrapper">
    <div class="modeler-parent">
      <div id="modeler-container"></div>
      <div class="side-panels">
        <div id="properties-container"></div>
        <div id="layer-container"></div>
      </div>
    </div>
  </div>
  <div id="boot-error"></div>

  <script type="module">
    // The page of the plugin AMLFPB.js (016f E3). It talks to the plugin over
    // the WebView2 bridge; the messages are listed in
    // FPB.JS_Docs/Geplante-Features/Plaene/2026-11-05-016f-E3-Plugin.md.
    // The AML document belongs to the editor: FPB.js gets the model as JSON
    // and loads no AML module of its own.

    // the console before it is forwarded, so the forwarder can log itself
    const nativeConsole = {
      log: console.log.bind(console),
      info: console.info.bind(console),
      warn: console.warn.bind(console),
      error: console.error.bind(console),
      debug: (console.debug || console.log).bind(console)
    };

    const post = (message) => {
      try {
        window.chrome.webview.postMessage(message);
      } catch (e) {
        nativeConsole.error('postMessage failed', e);
      }
    };

    // every console line, window error and unhandled rejection goes to the
    // log of the plugin; the plugin shows LOG and DEBUG only with "Verbose
    // debug logging"
    const formatArg = (a) => {
      if (a == null) return String(a);
      if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
      if (typeof a === 'string') return a;
      try { return JSON.stringify(a); } catch (_) { return String(a); }
    };
    for (const level of ['log', 'info', 'warn', 'error', 'debug']) {
      console[level] = (...args) => {
        try { post({ type: 'log', level, message: args.map(formatArg).join(' ') }); } catch (_) { /* never break the page */ }
        try { nativeConsole[level](...args); } catch (_) { /* nothing */ }
      };
    }
    window.addEventListener('error', (e) => {
      post({ type: 'log', level: 'error', message: 'window.error: ' + ((e.error && e.error.stack) || e.message || String(e)) });
    });
    window.addEventListener('unhandledrejection', (e) => {
      post({ type: 'log', level: 'error', message: 'unhandledRejection: ' + ((e.reason && e.reason.stack) || e.reason || '(no reason)') });
    });

    const showFatal = (text) => {
      const element = document.getElementById('boot-error');
      if (element) {
        element.textContent = text;
        element.style.display = 'flex';
      }
      post({ type: 'error', message: text });
    };

    let fpb;
    try {
      const { createFpbModeler } = await import('./fpbjs.esm.js');
      fpb = await createFpbModeler({
        container: document.getElementById('modeler-container'),
        propertiesContainer: document.getElementById('properties-container'),
        layerContainer: document.getElementById('layer-container'),
        // the editor opens and saves the document
        files: false,
        startCard: false,
        // the findings stand in the list of the plugin
        validation: { list: false }
      });
      // for the DevTools and the page tests
      window.fpb = fpb;
    } catch (err) {
      showFatal('FPB.js failed to load:\n' + ((err && err.stack) || err));
      throw err;
    }

    // the theme of the editor reaches the whole page, not only the containers
    fpb.on('theme.changed', (e) => {
      document.documentElement.setAttribute('data-theme', e.theme);
    });

    const snapshot = () => {
      try {
        return fpb.toJSON();
      } catch (e) {
        post({ type: 'error', message: 'snapshot failed: ' + ((e && e.stack) || e) });
        return null;
      }
    };

    // An import runs from importJSON to import.done. The answer waits one
    // task, so of two imports sent in a row only the newer one is answered.
    // FPB.js fires import.done for every import, also for one that a newer
    // import overtook; each number is answered once.
    let importing = false;
    let latestSeq = 0;
    let answeredSeq = 0;
    fpb.on('import.done', () => {
      const seq = latestSeq;
      setTimeout(() => {
        if (seq !== latestSeq || seq === answeredSeq) return;
        answeredSeq = seq;
        importing = false;
        post({ type: 'imported', seq, data: snapshot() });
      }, 0);
    });
    fpb.on('import.error', (e) => {
      importing = false;
      post({ type: 'error', message: 'import failed: ' + ((e && (e.details || e.message)) || '') });
    });

    fpb.on('changed', () => {
      if (importing) return;
      const data = snapshot();
      if (data !== null) post({ type: 'changed', data });
    });

    fpb.on('process.switched', (e) => {
      post({ type: 'processSwitched', id: (e && e.selectedProcess && e.selectedProcess.id) || null });
    });

    fpb.on('selection.changed', (e) => {
      const selected = (e && e.newSelection) || [];
      const last = selected[selected.length - 1];
      post({ type: 'selected', id: last ? last.id : null, processId: fpb.getCurrentProcess() });
    });

    fpb.on('fpbValidation.changed', () => {
      post({ type: 'findings', rules: fpb.getCheckedRules(), items: fpb.getFindings() });
    });

    // Ctrl+S saves through the editor. Listened to in the capture phase: the
    // label editor of diagram-js stops every key before it bubbles. A label
    // being edited on the canvas completes when it loses the focus; a field of
    // the properties panel writes what was typed in its own handler, after
    // this one, so the model is read a task later.
    window.addEventListener('keydown', (event) => {
      if (!((event.ctrlKey || event.metaKey) && !event.altKey && (event.key === 's' || event.key === 'S'))) return;
      event.preventDefault();
      const active = document.activeElement;
      if (active && active.isContentEditable) active.blur();
      setTimeout(() => {
        const data = snapshot();
        if (data !== null) post({ type: 'save', data });
      }, 0);
    }, true);

    window.chrome.webview.addEventListener('message', (e) => {
      const message = e.data;
      if (!message || typeof message !== 'object') return;
      try {
        switch (message.type) {
          case 'importJSON':
            latestSeq = message.seq;
            importing = true;
            fpb.importJSON(message.data);
            break;
          case 'setTheme':
            fpb.setTheme(message.theme === 'dark' ? 'dark' : 'light');
            break;
          case 'setReadOnly':
            fpb.setReadOnly(!!message.readOnly);
            break;
          case 'select':
            // the process itself in the AML tree: only its layer
            if (message.processId && message.id === message.processId) {
              fpb.switchProcess(message.processId);
            } else if (!fpb.select(message.id, { process: message.processId || undefined, scroll: true })) {
              post({ type: 'log', level: 'info', message: 'select: no element ' + message.id + ' on layer ' + message.processId });
            }
            break;
          case 'setValidationMarkers':
            fpb.setValidationMarkers(!!message.show);
            break;
          case 'setAmlLinks':
            fpb.setAmlLinks(Array.isArray(message.links) ? message.links : null);
            break;
          default:
            post({ type: 'log', level: 'warn', message: 'unknown message of the plugin: ' + message.type });
        }
      } catch (err) {
        importing = false;
        post({ type: 'error', message: 'handling ' + message.type + ' failed: ' + ((err && err.stack) || err) });
      }
    });

    post({ type: 'ready', url: location.href });
  </script>
</body>
</html>
