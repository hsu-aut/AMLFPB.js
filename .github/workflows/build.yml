name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Checkout layout mirrors the local dev tree, because the plugin uses
      # <ProjectReference> + relative-path content references into its
      # siblings:
      #   <workspace>/AML/fpb-aml-editor-plugin   (this repo)
      #   <workspace>/AML/fpb-aml-mapper          (..\..\fpb-aml-mapper)
      #   <workspace>/OclNet                      (..\..\..\OclNet — pre-rename
      #                                            directory name, repo is OCL.NET)
      #   <workspace>/FPB.JS                      (..\..\..\FPB.JS\dist)
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: AML/fpb-aml-editor-plugin

      - name: Checkout mapper
        uses: actions/checkout@v4
        with:
          repository: hsu-aut/fpb-aml-mapper
          path: AML/fpb-aml-mapper
          # Mapper is public; no token needed. If it ever goes private:
          # token: ${{ secrets.GH_PAT }}

      - name: Checkout FPB.JS
        uses: actions/checkout@v4
        with:
          repository: hamiedNabizada/FPB.js
          path: FPB.JS

      - name: Checkout OCL.NET
        uses: actions/checkout@v4
        with:
          repository: HamiedNabizada/OCL.NET
          path: OclNet

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node (for FPB.JS dist)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build FPB.JS dist
        working-directory: FPB.JS
        run: |
          npm ci
          npm run build

      - name: Restore + build plugin
        working-directory: AML/fpb-aml-editor-plugin
        # With the local-layout checkout above, the csproj defaults (including
        # FpbJsDistDir = ..\..\..\FPB.JS\dist) resolve as-is; the explicit
        # override just keeps the path visible in the log.
        run: |
          dotnet restore Aml.Editor.Plugin.FPB.sln
          dotnet build Aml.Editor.Plugin.FPB.sln -c Release --no-restore /p:FpbJsDistDir="${{ github.workspace }}\FPB.JS\dist"

      - name: Test
        working-directory: AML/fpb-aml-editor-plugin
        run: dotnet test Aml.Editor.Plugin.FPB.Tests/Aml.Editor.Plugin.FPB.Tests.csproj -c Release --no-build

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aml.Editor.Plugin.FPB-nupkg
          path: AML/fpb-aml-editor-plugin/build/Plugins/Aml.Editor.Plugin.FPB/Release/*.nupkg

  check-version:
    # For a version tag only. The tag has to match the package version, or a tag
    # v0.9.0 would publish a 0.8.1 package.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.FPB-nupkg
          path: nupkg

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "nupkg/Aml.Editor.Plugin.FPB.${version}.nupkg" || { ls nupkg; echo "no package for version ${version}"; exit 1; }

  nuget:
    # Publishes to nuget.org, where the AutomationML Editor finds the plugin under
    # PublicSource by its tag AMLEditorPlugin.Net. Trusted publishing: GitHub proves
    # the workflow's identity (OIDC) and nuget.org hands out a short-lived key, so no
    # API key is stored in the repository. A version on nuget.org cannot be replaced,
    # so the environment can require an approval before this job runs.
    needs: check-version
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.FPB-nupkg
          path: nupkg

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org account (profile name, not e-mail) that owns the trusted publishing policy.
          user: ${{ vars.NUGET_USER }}

      - name: Push the package
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    # On version tags attach the nupkg to the GitHub Release; the notes are
    # generated from the commits and pull requests since the previous tag.
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.FPB-nupkg
          path: nupkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
          fail_on_unmatched_files: true
