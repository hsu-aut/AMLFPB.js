name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # required for the release-on-tag step below

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Checkout layout mirrors the local dev tree, because the plugin uses
      # <ProjectReference> + relative-path content references into its
      # siblings:
      #   <workspace>/AML/fpb-aml-editor-plugin   (this repo)
      #   <workspace>/AML/fpb-aml-mapper          (..\..\fpb-aml-mapper)
      #   <workspace>/OclNet                      (..\..\..\OclNet — pre-rename
      #                                            directory name, repo is OCL.NET)
      #   <workspace>/FPB.JS                      (..\..\..\FPB.JS\dist)
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: AML/fpb-aml-editor-plugin

      - name: Checkout mapper
        uses: actions/checkout@v4
        with:
          repository: hsu-aut/fpb-aml-mapper
          path: AML/fpb-aml-mapper
          # Mapper is public; no token needed. If it ever goes private:
          # token: ${{ secrets.GH_PAT }}

      - name: Checkout FPB.JS
        uses: actions/checkout@v4
        with:
          repository: hamiedNabizada/FPB.js
          path: FPB.JS

      - name: Checkout OCL.NET
        uses: actions/checkout@v4
        with:
          repository: HamiedNabizada/OCL.NET
          path: OclNet

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node (for FPB.JS dist)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build FPB.JS dist
        working-directory: FPB.JS
        run: |
          npm ci
          npm run build

      - name: Restore + build plugin
        working-directory: AML/fpb-aml-editor-plugin
        # With the local-layout checkout above, the csproj defaults (including
        # FpbJsDistDir = ..\..\..\FPB.JS\dist) resolve as-is; the explicit
        # override just keeps the path visible in the log.
        run: |
          dotnet restore Aml.Editor.Plugin.FPB.sln
          dotnet build Aml.Editor.Plugin.FPB.sln -c Release --no-restore /p:FpbJsDistDir="${{ github.workspace }}\FPB.JS\dist"

      - name: Test
        working-directory: AML/fpb-aml-editor-plugin
        run: dotnet test Aml.Editor.Plugin.FPB.Tests/Aml.Editor.Plugin.FPB.Tests.csproj -c Release --no-build

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aml.Editor.Plugin.FPB-nupkg
          path: AML/fpb-aml-editor-plugin/build/Plugins/Aml.Editor.Plugin.FPB/Release/*.nupkg

      # On version tags (v0.5.0, v1.2.3, …) attach the produced nupkg as a
      # download asset on the corresponding GitHub Release. Release notes are
      # auto-generated from the commits/PRs since the previous tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AML/fpb-aml-editor-plugin/build/Plugins/Aml.Editor.Plugin.FPB/Release/*.nupkg
          generate_release_notes: true
          fail_on_unmatched_files: true
